name: Build Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # for the draft release on tags

jobs:
  deploy:
    env:
      LEXSIFT_DEBUG_BUILD: ${{ github.ref_type != 'tag' && 'yes' || '' }} # Set to 'yes' if not a tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: MacOS (Apple Silicon)
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install headers for lzo (Ubuntu)
      run: |
        sudo apt install -y liblzo2-dev zlib1g-dev
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Install lzo (macOS)
      # Must come before pip install: python-lzo builds against it. It only looks in /usr or a bundled
      # source folder, so point it at Homebrew, and build arm64 only since Homebrew's lzo is not universal
      run: |
        brew install lzo
        echo "LZO_DIR=$(brew --prefix lzo)" >> "$GITHUB_ENV"
        echo "ARCHFLAGS=-arch arm64" >> "$GITHUB_ENV"
      if: ${{ runner.os == 'macOS' }}
    - name: Install dependencies
      run: |
        pip install wheel
        pip install -r requirements.txt
        pip install "cx_Freeze>=8.7,<9"
    - name: Build Windows App
      run: |
        cd cx_freeze
        python setup.py bdist_msi
      if: ${{ matrix.os == 'windows-latest' }}
    - name: Build Mac App
      run: |
        cd cx_freeze
        python setup.py bdist_dmg
      if: ${{ runner.os == 'macOS' }}
    - name: Build Linux AppImage
      run: |
        pip install python-appimage
        cp lexsift.{desktop,png} recipe/
        echo $(pwd) | cat - recipe/requirements.txt > tmpfile && mv tmpfile recipe/requirements.txt
        python -m python_appimage build app -p 3.11 recipe
        mv Lexsift-x86_64.AppImage Lexsift-v$(grep version setup.cfg | awk '{print $3}')-linux-amd64.AppImage
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.label }} App
        path: |
          cx_freeze/dist/*
          cx_freeze/build/*.dmg
      if: ${{ runner.os != 'Linux' }}
    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v4
      with:
        name: Linux AppImage
        path: |
          *.AppImage
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          cx_freeze/dist/*
          cx_freeze/build/*.dmg
          *.AppImage
        draft: true
